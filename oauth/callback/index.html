<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yps OAuth Callback</title>
</head>
<body>
  <h1>Yps OAuth Callback</h1>

  <p id="status">Processing authorization response…</p>

  <p id="code-container" hidden>
    <strong>Authorization code:</strong><br>
    <code id="code"></code>
  </p>

  <p id="continue-container" hidden>
    <a id="continue-link" href="#">Continue locally</a>
  </p>

  <script>
    const params = new URLSearchParams(window.location.search);

    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");
    const errorDescription = params.get("error_description");

    const status = document.getElementById("status");
    const codeContainer = document.getElementById("code-container");
    const codeElement = document.getElementById("code");
    const continueContainer = document.getElementById("continue-container");
    const continueLink = document.getElementById("continue-link");

    if (code && state) {
      status.textContent =
        "Authorization successful. Continue with the local Yps application.";

      codeElement.textContent = code;
      codeContainer.hidden = false;

      const localUrl = new URL("http://127.0.0.1:8765/callback");
      localUrl.searchParams.set("code", code);
      localUrl.searchParams.set("state", state);

      continueLink.href = localUrl.toString();
      continueContainer.hidden = false;
    } else if (code) {
      status.textContent =
        "Authorization code received, but OAuth state is missing.";

      codeElement.textContent = code;
      codeContainer.hidden = false;
    } else if (error) {
      status.textContent =
        "Authorization failed: " + error +
        (errorDescription ? " — " + errorDescription : "");
    } else {
      status.textContent =
        "No OAuth authorization response was supplied.";
    }
  </script>
</body>
</html>
